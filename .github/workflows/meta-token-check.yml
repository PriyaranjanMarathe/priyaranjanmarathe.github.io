name: Verify Meta attachment token
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Verify system user, expiry and selected media access
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INBOX_READ_TOKEN: ${{ secrets.INBOX_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,urllib.error,json,os,hashlib
          token=os.environ['META_ACCESS_TOKEN']
          def get(url,credential):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+credential})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:return r.read()
              except urllib.error.HTTPError as e:
                  print('Request failed with HTTP',e.code)
                  raise SystemExit(1)
          who=json.loads(get('https://graph.facebook.com/v25.0/me?fields=id',token))
          assert who.get('id')=='61594580491651','Unexpected token identity'
          print('Dedicated system-user identity: verified')
          debug=json.loads(get('https://graph.facebook.com/v25.0/debug_token?'+urllib.parse.urlencode({'input_token':token}),token))['data']
          print('Token valid:',debug.get('is_valid'))
          print('Token expiry timestamp:',debug.get('expires_at'))
          print('Data access expiry timestamp:',debug.get('data_access_expires_at'))
          print('Token scopes:',','.join(debug.get('scopes',[])))
          assert debug.get('is_valid') is True
          assert debug.get('expires_at')==0,'Token has a scheduled expiry'
          assert debug.get('app_id')=='2092484468020400'
          messages=json.loads(get('https://saved-finds-receiver.vercel.app/api/inbox',os.environ['INBOX_READ_TOKEN']))['messages']
          records=json.load(open('docs/finds/finds.json'))
          selected={r['id'] for r in records}
          tested=0
          for m in messages:
              if not m.get('media') or hashlib.sha256(m['id'].encode()).hexdigest()[:24] not in selected:continue
              media=json.loads(get('https://graph.facebook.com/v25.0/'+m['media']['id'],token))
              url=media['url']
              assert urllib.parse.urlsplit(url).hostname=='lookaside.fbsbx.com'
              raw=get(url,token)
              assert len(raw)<=20*1024*1024
              if media.get('sha256'):assert hashlib.sha256(raw).hexdigest()==media['sha256']
              print('Selected attachment download and checksum: verified',media['mime_type'],len(raw),'bytes')
              tested+=1
          assert tested>0,'No retained selected media available for live test'
          print('Verified selected attachments:',tested)
          PY
